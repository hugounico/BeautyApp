{% extends 'base.html' %}

{% block title %}Ingresar · BeautyFull{% endblock %}

{% block content %}
<main class="auth">
    <h1>Ingresar</h1>

    {% if form.errors %}
    <p class="auth__error" role="alert">
        Usuario o contraseña incorrectos. Revisa tus credenciales e inténtalo de nuevo.
    </p>
    {% endif %}

    <form method="post" action="{% url 'login' %}" class="auth__form">
        {% csrf_token %}
        {{ form.as_p }}
        {% if next %}
        <input type="hidden" name="next" value="{{ next }}">
        {% endif %}
        <button type="submit">Ingresar</button>
    </form>
</main>
{% endblock %}
